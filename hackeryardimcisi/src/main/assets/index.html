<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hacker Yardımcısı Şikru</title>
<style>
:root{color-scheme:dark;--g:#00ff9c;--r:#ff2b4a;--c:#19e6ff;--bg:#020806;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--g);font-family:"Courier New",ui-monospace,monospace;overflow:hidden;-webkit-user-select:none;user-select:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
#app{height:100%;display:flex;flex-direction:column;padding:10px}
#hdr{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--g);padding:10px 14px;position:relative;touch-action:none;text-shadow:0 0 8px var(--g)}
#hdr b{letter-spacing:3px}
#bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--c);box-shadow:0 0 10px var(--c)}
#status{font-size:13px;color:var(--c)}
#main{flex:1;min-height:0;margin:10px 0;border:1px solid #0a5;padding:12px;position:relative;overflow:hidden}
.view{display:none;height:100%;flex-direction:column}
.view.on{display:flex}
#log{flex:1;overflow:auto;font-size:15px;line-height:1.5;white-space:pre-wrap}
#log div{text-shadow:0 0 5px var(--g)}
.err{color:var(--r)!important}.inf{color:var(--c)!important}
#clock{margin:auto;text-align:center}
#time{font-size:min(18vw,120px);text-shadow:0 0 20px var(--g)}
#date{font-size:18px;color:var(--c)}
#notes{flex:1;width:100%;background:#00110a;color:var(--g);border:1px solid #0a5;font:16px "Courier New",monospace;padding:10px;resize:none;-webkit-user-select:text;user-select:text}
.prog{height:22px;border:1px solid var(--g);margin:10px 0}
.prog i{display:block;height:100%;width:0;background:var(--g);box-shadow:0 0 12px var(--g)}
#cmdrow{display:flex;gap:8px}
#cmd{flex:1;background:#00110a;border:1px solid #0a5;color:var(--g);font:14px "Courier New",monospace;padding:8px;-webkit-user-select:text;user-select:text}
#go{background:none;border:1px solid var(--g);color:var(--g);padding:0 14px;font:inherit}
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:#000}
.ov.on{display:flex}
#warn{background:#2a0008;color:var(--r)}
#warn .n{font-size:40vmin;font-weight:bold;text-shadow:0 0 40px var(--r);animation:pulse .5s infinite alternate}
#warn .t{font-size:5vmin;letter-spacing:4px}
@keyframes pulse{to{transform:scale(1.08);opacity:.7}}
#bye{font-size:8vmin;color:var(--c);text-shadow:0 0 20px var(--c)}
#errscr{background:#1a0004;color:var(--r)}
#errscr h1{font-size:7vmin;margin:0;text-shadow:3px 0 var(--c),-3px 0 var(--g)}
.glitch{animation:gl .12s infinite}
@keyframes gl{0%{transform:translate(0)}25%{transform:translate(-8px,3px);filter:hue-rotate(90deg)}50%{transform:translate(7px,-4px);filter:invert(1)}75%{transform:translate(-4px,-6px);filter:hue-rotate(200deg)}100%{transform:translate(5px,5px)}}
#listen{position:fixed;right:14px;bottom:70px;z-index:40;display:none;border:1px solid var(--c);color:var(--c);padding:8px 12px;background:#001318}
#listen.on{display:block;animation:pulse .6s infinite alternate}
#sky{position:fixed;inset:0;z-index:0;width:100%;height:100%}
#app{position:relative;z-index:2}
#main{background:rgba(2,8,6,.45)}
body.t-red{--g:#ff2b4a;--c:#ffb000}
body.t-blue{--g:#19b6ff;--c:#c9a0ff}
@keyframes hue{to{filter:hue-rotate(360deg)}}
body.disco #app{animation:hue 1.5s linear infinite}
/* ===== v1.8 görünüm: CRT ekran, köşe braketleri, ızgara, hızlı komutlar ===== */
html,body{background:radial-gradient(ellipse at 50% 35%,#04160f 0%,var(--bg) 62%,#000 100%)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background:linear-gradient(rgba(0,255,156,.055) 1px,transparent 1px) 0 0/100% 28px,linear-gradient(90deg,rgba(0,255,156,.055) 1px,transparent 1px) 0 0/28px 100%;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 85%);mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 85%)}
body::after{z-index:60;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.4) 100%)}
#rain{position:fixed;inset:0;z-index:0;width:100%;height:100%;opacity:.16;pointer-events:none}
#app{padding:12px;gap:0}
#hdr{border:1px solid color-mix(in srgb,var(--g) 55%,transparent);border-radius:4px;background:linear-gradient(180deg,color-mix(in srgb,var(--g) 12%,transparent),color-mix(in srgb,var(--g) 3%,transparent));box-shadow:0 0 18px color-mix(in srgb,var(--g) 18%,transparent),inset 0 0 22px color-mix(in srgb,var(--g) 8%,transparent);gap:10px}
#hdr b{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr b::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--g);box-shadow:0 0 6px var(--g),0 0 16px var(--g);animation:led 1.6s ease-in-out infinite}
@keyframes led{50%{opacity:.35}}
#status{font-size:11.5px;letter-spacing:1px;padding:4px 9px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:999px;background:color-mix(in srgb,var(--c) 10%,transparent);text-shadow:0 0 8px var(--c);white-space:nowrap;flex:none}
#main{border:1px solid color-mix(in srgb,var(--g) 35%,transparent);border-radius:4px;background:rgba(2,10,7,.62);box-shadow:inset 0 0 40px rgba(0,0,0,.7),inset 0 0 0 1px rgba(0,0,0,.6),0 0 22px color-mix(in srgb,var(--g) 10%,transparent);padding:16px 14px 14px}
#main::before,#main::after{content:"";position:absolute;width:22px;height:22px;pointer-events:none;border:2px solid var(--g);filter:drop-shadow(0 0 5px var(--g))}
#main::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
#main::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
#sweep{position:absolute;left:0;right:0;top:0;height:90px;pointer-events:none;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--g) 7%,transparent) 80%,color-mix(in srgb,var(--g) 16%,transparent));animation:sweep 5.5s linear infinite;z-index:1}
@keyframes sweep{from{transform:translateY(-100px)}to{transform:translateY(100vh)}}
#log{position:relative;z-index:2;scrollbar-width:thin;scrollbar-color:var(--g) transparent}
#log div{padding:1px 0 1px 10px;border-left:2px solid color-mix(in srgb,var(--g) 30%,transparent);margin-bottom:3px;animation:ln .18s ease-out}
#log div.err{border-left-color:var(--r);text-shadow:0 0 6px var(--r);background:linear-gradient(90deg,color-mix(in srgb,var(--r) 12%,transparent),transparent 60%)}
#log div.inf{border-left-color:var(--c);text-shadow:0 0 6px var(--c)}
#log::after{content:"█";display:inline-block;margin-left:10px;animation:led 1s steps(1) infinite;text-shadow:0 0 8px var(--g)}
@keyframes ln{from{opacity:0;transform:translateX(-6px)}}
#time{font-weight:bold;font-size:min(15.5vw,120px);letter-spacing:.02em;font-variant-numeric:tabular-nums}
#notes{border-radius:4px;background:rgba(0,17,10,.7)}
.prog{border-radius:3px;padding:2px;background:rgba(0,0,0,.5)}
.prog i{background:repeating-linear-gradient(90deg,var(--g) 0 8px,transparent 8px 11px)}
#chips{display:flex;gap:7px;overflow-x:auto;padding:0 0 9px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;background:color-mix(in srgb,var(--g) 7%,transparent);border:1px solid color-mix(in srgb,var(--g) 45%,transparent);color:var(--g);font:12.5px "Courier New",ui-monospace,monospace;padding:8px 11px;border-radius:3px;white-space:nowrap;text-shadow:0 0 6px var(--g);letter-spacing:.5px}
#chips button::before{content:"> ";opacity:.6}
#chips button:active{background:var(--g);color:#001a10;text-shadow:none}
#cmdrow{position:relative;gap:8px}
#cmdrow::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--c);text-shadow:0 0 8px var(--c);font-weight:bold;pointer-events:none;z-index:1}
#cmd{border:1px solid color-mix(in srgb,var(--g) 45%,transparent);border-radius:4px;padding:12px 10px 12px 30px;font-size:15px;background:rgba(0,17,10,.8);outline:0;min-width:0}
#cmd:focus{border-color:var(--g);box-shadow:0 0 14px color-mix(in srgb,var(--g) 35%,transparent)}
#cmd::placeholder{color:color-mix(in srgb,var(--g) 45%,transparent)}
#go{border-radius:4px;background:color-mix(in srgb,var(--g) 14%,transparent);font-weight:bold;letter-spacing:2px;padding:0 16px;text-shadow:0 0 8px var(--g);box-shadow:0 0 12px color-mix(in srgb,var(--g) 20%,transparent)}
#go:active{background:var(--g);color:#001a10;text-shadow:none}
#listen{border-radius:4px;bottom:120px;box-shadow:0 0 16px var(--c)}
@media (prefers-reduced-motion:reduce){#sweep,#hdr b::before,#log::after{animation:none}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<canvas id="sky"></canvas>
<div id="app">
  <div id="hdr"><b>HACKER YARDIMCISI ŞİKRU</b><span id="status">HAZIR · 5 sn basılı tut</span><div id="bar"></div></div>
  <div id="main"><div id="sweep"></div>
    <div class="view on" id="v-term"><div id="log"></div></div>
    <div class="view" id="v-notes"><textarea id="notes" placeholder="// lokal notlar..."></textarea></div>
    <div class="view" id="v-clock"><div id="clock"><div id="time">00:00:00</div><div id="date"></div></div></div>
    <div class="view" id="v-sim"><div id="simlog" style="flex:1;overflow:auto;font-size:15px;line-height:1.5;white-space:pre-wrap"></div><div class="prog"><i id="pb"></i></div><div id="pt" class="inf">0%</div></div>
  </div>
  <div id="chips"></div>
  <div id="cmdrow"><input id="cmd" placeholder="komut yaz..." autocomplete="off"><button id="go">GÖNDER</button></div>
</div>
<div id="listen">🎙 DİNLİYOR...</div>
<div class="ov" id="warn"><div class="t">⚠ UYARI ⚠</div><div class="n" id="wn">3</div><div class="t">SIZMA BAŞLIYOR</div></div>
<div class="ov" id="errscr"><h1>HATA: İSTEK BAŞARISIZ!</h1></div>
<div class="ov" id="byescr"><div id="bye">Elvedaa...</div></div>

<script>
const $=id=>document.getElementById(id);
/* ===== SES MOTORU (WebAudio, çevrimdışı) ===== */
let AC=null,muted=false,humOn=false,humG=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}return AC}
function tone(f,d,type,v,sl){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=type||"square";o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);g.gain.setValueAtTime(v||.04,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d)}
function noise(d,v,f0,f1,rise){if(muted)return;const a=ac();if(!a)return;const n=a.currentTime,b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type="lowpass";fl.frequency.setValueAtTime(f0,n);fl.frequency.exponentialRampToValueAtTime(f1,n+d);if(rise){g.gain.setValueAtTime(.01,n);g.gain.linearRampToValueAtTime(v,n+d*.97);g.gain.linearRampToValueAtTime(.0001,n+d)}else{g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d)}s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(n)}
function startAudio(){const a=ac();if(!a||humOn)return;humOn=true;humG=a.createGain();humG.gain.value=muted?0:.015;const o=a.createOscillator(),lf=a.createOscillator(),lg=a.createGain(),fl=a.createBiquadFilter();o.type="sawtooth";o.frequency.value=55;fl.type="lowpass";fl.frequency.value=220;lf.frequency.value=.3;lg.gain.value=.006;lf.connect(lg);lg.connect(humG.gain);o.connect(fl);fl.connect(humG);humG.connect(a.destination);o.start();lf.start();setInterval(()=>{if(!busy){tone(500+Math.random()*1500,.05,"square",.015);if(Math.random()<.2)noise(.15,.04,3000,400)}},2200)}
function setMute(m){muted=m;if(humG)humG.gain.value=m?0:.015}
function blip(c){tone(c==="err"?180:c==="inf"?1200:700+Math.random()*500,.05,c==="err"?"sawtooth":"square",.03)}
function siren(){tone(880,.45,"sawtooth",.07,-300);setTimeout(()=>tone(520,.45,"sawtooth",.07,300),480)}
function descend(){[800,600,450,300,200].forEach((f,i)=>setTimeout(()=>tone(f,.3,"triangle",.07),i*350))}
function beepSeq(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.12,"square",.05),i*90))}
function glitchSound(ms){const iv=setInterval(()=>{noise(.12,.15,6000,300);tone(100+Math.random()*1500,.08,"sawtooth",.05)},130);setTimeout(()=>clearInterval(iv),ms)}
function boom(){noise(2.5,.9,3000,60);tone(120,1.2,"sine",.3,-90)}
function rumble(s){noise(s,.5,200,800,true)}
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,startAudio));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let busy=false,clockT=null;
function show(v){document.querySelectorAll(".view").forEach(e=>e.classList.remove("on"));$("v-"+v).classList.add("on");if(v!=="clock"&&clockT){clearInterval(clockT);clockT=null}}
function status(t){$("status").textContent=t}
function log(t,cls){blip(cls);const d=document.createElement("div");d.textContent=t;if(cls)d.className=cls;$("log").appendChild(d);$("log").scrollTop=1e9}
function slog(t,cls){blip(cls);const d=document.createElement("div");d.textContent=t;if(cls)d.className=cls;$("simlog").appendChild(d);$("simlog").scrollTop=1e9}
function toTerm(){show("term");status("HAZIR · 5 sn basılı tut")}

try{$("notes").value=localStorage.getItem("hk_notes")||""}catch(e){}
$("notes").addEventListener("input",()=>{try{localStorage.setItem("hk_notes",$("notes").value)}catch(e){}});

function tick(){const n=new Date();$("time").textContent=n.toLocaleTimeString("tr-TR");$("date").textContent=n.toLocaleDateString("tr-TR",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}
function showClock(){show("clock");status("SİSTEM SAATİ");tick();clockT=setInterval(tick,1000)}

async function simulate(title,steps,fail){
  busy=true;show("sim");$("simlog").innerHTML="";$("pb").style.width="0";status(title);
  for(let i=0;i<steps.length;i++){
    slog("> "+steps[i],i%4===3?"inf":"");tone(300+i*80,.15,"sawtooth",.04,200);
    const p=Math.round((i+1)/steps.length*100);$("pb").style.width=p+"%";$("pt").textContent=p+"%";
    await sleep(650+Math.random()*500);
  }
  if(fail){
    $("errscr").classList.add("on","glitch");glitchSound(3000);
    await sleep(3000);
    $("errscr").classList.remove("on","glitch");
    toTerm();log("HATA: İSTEK BAŞARISIZ! Ana terminale dönüldü.","err");onDone("ÖZ-HACK");
  }else{slog("✔ İŞLEM TAMAM","inf");await sleep(1800);toTerm();log(title+" tamamlandı.","inf");onDone(title)}
  busy=false;
}
async function countdown(){
  $("warn").classList.add("on");
  for(let i=3;i>=1;i--){$("wn").textContent=i;siren();await sleep(1000)}
  $("warn").classList.remove("on");
}
async function goodbye(){
  busy=true;$("byescr").classList.add("on");descend();
  try{const u=new SpeechSynthesisUtterance("Elvedaa");u.lang="tr-TR";speechSynthesis.speak(u)}catch(e){}
  await sleep(2500);
  try{
    if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App){await Capacitor.Plugins.App.exitApp();return}
    if(navigator.app&&navigator.app.exitApp){navigator.app.exitApp();return}
  }catch(e){}
  $("bye").textContent="Elvedaa... (web sürümünde uygulama kapanmaz)";
  await sleep(2500);$("byescr").classList.remove("on");busy=false;toTerm();
}

/* ===== ARKA PLAN: DÜNYA + MARS / MATRIX ===== */
const cv=$("sky"),cx=cv.getContext("2d");let skyMode=null,raf2=0;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
function mode(m){skyMode=m;cancelAnimationFrame(raf2);cx.clearRect(0,0,cv.width,cv.height);if(m==="matrix")matrix()}
function matrix(){const cols=Math.floor(cv.width/16),y=Array(cols).fill(0);const f=()=>{if(skyMode!=="matrix")return;cx.fillStyle="rgba(2,8,6,.12)";cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle="#00ff9c";cx.font="16px monospace";y.forEach((v,i)=>{cx.fillText(String.fromCharCode(0x30A0+Math.random()*96),i*16,v);y[i]=v>cv.height&&Math.random()>.975?0:v+16});raf2=requestAnimationFrame(f)};f()}
async function marsHit(){
 busy=true;mode("mars");status("KIYAMET");log("⚠ Dünya hedef alındı: Mars rotası kilitlendi","err");
 const W=cv.width,H=cv.height,R=Math.min(W,H)*.25,ex=W*.5,ey=H*.5,sx=-R,sy=H*.1;
 const stars=Array.from({length:80},()=>[Math.random()*W,Math.random()*H,Math.random()*1.6]);
 const t0=performance.now();let parts=[],hit=false,shock=0,fl=0;rumble(5.2);
 [[1500,"Mars yörüngesinden çıktı..."],[3200,"Çarpışmaya 2 saniye..."],[5000,"💥 ÇARPIŞMA! Dünya yok oluyor"],[8200,"Dünya yok edildi. Ama Wi-Fi hâlâ çekiyor."]].forEach(([ms,m])=>setTimeout(()=>log(m,"err"),ms));
 await new Promise(res=>{const f=now=>{
  const t=(now-t0)/1000,k=Math.min(1,t/5),e=k*k;
  cx.clearRect(0,0,W,H);cx.fillStyle="#fff";cx.globalAlpha=.6;stars.forEach(s=>cx.fillRect(s[0],s[1],s[2],s[2]));cx.globalAlpha=1;
  cx.save();if(hit&&t<7)cx.translate((Math.random()-.5)*14,(Math.random()-.5)*14);
  if(!hit){
   const g=cx.createRadialGradient(ex-R*.3,ey-R*.3,R*.1,ex,ey,R);g.addColorStop(0,"#5ec8ff");g.addColorStop(1,"#0a3a8a");
   cx.fillStyle=g;cx.beginPath();cx.arc(ex,ey,R,0,7);cx.fill();
   cx.fillStyle="#2f9e4f";[[-.3,-.2,.35],[.25,.15,.3],[-.1,.45,.18]].forEach(c=>{cx.beginPath();cx.arc(ex+c[0]*R,ey+c[1]*R,c[2]*R,0,7);cx.fill()});
   const mx=sx+(ex-R*.8-sx)*e,my=sy+(ey-R*.2-sy)*e,mr=R*(.25+.3*e);
   const g2=cx.createRadialGradient(mx-mr*.3,my-mr*.3,mr*.1,mx,my,mr);g2.addColorStop(0,"#ff9a5a");g2.addColorStop(1,"#7a1d0a");
   cx.fillStyle=g2;cx.beginPath();cx.arc(mx,my,mr,0,7);cx.fill();
  }
  if(!hit&&t>=5){hit=true;fl=1;boom();for(let i=0;i<220;i++){const a=Math.random()*6.28,s=2+Math.random()*9;parts.push([ex,ey,Math.cos(a)*s,Math.sin(a)*s,1,Math.random()<.5?"#ff7a1a":Math.random()<.5?"#2f9e4f":"#5ec8ff"])}}
  if(hit){fl=Math.max(0,fl-.02);shock+=14;
   cx.strokeStyle="rgba(255,160,60,"+Math.max(0,1-shock/(W*.8))+")";cx.lineWidth=6;cx.beginPath();cx.arc(ex-R*.4,ey,shock,0,7);cx.stroke();
   parts.forEach(p=>{p[0]+=p[2];p[1]+=p[3];p[3]+=.05;p[4]-=.006;if(p[4]>0){cx.globalAlpha=p[4];cx.fillStyle=p[5];cx.fillRect(p[0],p[1],6,6)}});cx.globalAlpha=1;
  }
  cx.restore();
  if(fl>0){cx.fillStyle="rgba(255,255,255,"+fl+")";cx.fillRect(0,0,W,H)}
  if(t>10)res();else raf2=requestAnimationFrame(f)};raf2=requestAnimationFrame(f)});
 mode(null);log("DÜNYA YOK EDİLDİ.","err");status("HAZIR · 5 sn basılı tut");busy=false;
}
function theme(c){document.body.className=document.body.className.replace(/t-\w+/g,"").trim();if(c)document.body.classList.add(c)}
const JOKES=["Hacker ekranında bile Wi-Fi çekmiyor.","Fırını hackledim, kek yandı.","Şifrem şifre123. Kimseye söyleme.","Matrixe girdim, kargo hâlâ gelmedi."];
const SIMS=[

function qa(t,w){
 const T=re=>re.test(t),adj=lc(pick(ADJ)),nn=pick(NOUN),q="“"+w+"”";
 if(T(/ne zaman|ne vakit|ka[çc]ta/))return q+" için tahminim: "+pick(["yarın","bu gece","haftaya","Mars hizalanınca","pil bitince","fırın soğuyunca"])+" saat "+String(Math.floor(Math.random()*24)).padStart(2,"0")+":"+String(Math.floor(Math.random()*60)).padStart(2,"0")+" civarı.";
 if(T(/nerede|nereye|nereden/))return q+" bence "+pick(PLACE)+".";
 if(T(/(^| )(kim|kimin|kime|kimi)( |$)/))return q+" için şüphelim: "+adj+" bir "+nn+".";
 if(T(/(^| )(ka[çc]|ka[çc][ıi]|ne kadar)( |$)/))return q+" için sayım: "+(Math.random()*9999|0)+" "+pick(["adet","bayt","fırın","kek","paket","sinyal"])+".";
 if(T(/neden|niye|ni[çc]in/))return "çünkü "+lc(mini()).replace(/[.]$/,"")+", yani "+q+" böyle olmak zorunda.";
 if(T(/nas[ıi]l/))return q+" için plan: önce "+pick(PLACE)+" ara, sonra "+lc(mini());
 if(T(/hangi/))return "bence "+adj+" olanı. "+q+" için sezgilerim güçlü.";
 if(T(/(^| )(mi|m[ıi]|mu|m[üu])( |$)/))return lc(pick(["Evet","Hayır","Belki","Büyük ihtimalle evet","Büyük ihtimalle hayır"]))+", "+q+" konusunda %"+(50+Math.random()*49|0)+" eminim.";
 if(T(/(^| )(ne|nedir)( |$)/))return q+" bence "+adj+" bir "+nn+" gibi bir şey.";
 return pick(QA);
}

const VOC=["merhaba","terminal","notlar","sayaç","hackle","hekle","koruma","duvarı","aşılıyor","fırını","dünyayı","matrix","disko","kamera","uydu","televizyon","dron","şifre","bitti","komutlar","temizle","nasılsın","teşekkürler","hikaye","devam","bekle","patlat","kapat","söndür","kurtar","nasıl","neden","nerede","hangi","nedir"];
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
/* ===== KELİME ALGILAMA: Türkçe ek ayıklama + ASCII/diyakritik + yazım hatası toleranslı kök bulma ===== */
const asc=s=>s.replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");
const SFX=[...new Set(["lar","ler","ım","im","um","üm","ın","in","un","ün","ımız","imiz","umuz","ümüz","ınız","iniz","unuz","ünüz","ları","leri","dan","den","tan","ten","da","de","ta","te","nın","nin","nun","nün","ya","ye","yı","yi","yu","yü","la","le","cı","ci","cu","cü","çı","çi","çu","çü","lık","lik","luk","lük","sız","siz","suz","süz","lı","li","lu","lü","yor","dı","di","du","dü","tı","ti","tu","tü","mış","miş","muş","müş","acak","ecek","malı","meli","ma","me","sın","sin","sun","sün","ız","iz","uz","üz","ır","ir","ur","ür","a","e","ı","i","u","ü"].map(asc))].sort((a,b)=>b.length-a.length);
function stem1(s){for(const x of SFX){if(s.length-x.length>=3&&s.endsWith(x))return s.slice(0,-x.length)}return null}
const ROOTS=[...new Set([...VOC,...LEXW,...NOUN.filter(n=>!n.includes(" ")).map(lc),...ADJ.map(lc)])];
const VR={};ROOTS.forEach(v=>{VR[asc(v)]=v;let s=asc(v),g=0;while(g++<3){const n=stem1(s);if(!n)break;s=n;VR[s]=VR[s]||v}});
function rootOf(w){let s=asc(w),g=0;while(s&&g++<8){if(VR[s])return VR[s];if(s.length>=6){let bd=9,b=null;for(const k in VR){const d=lev(s,k);if(d<bd){bd=d;b=VR[k]}}if(bd<=(s.length<9?1:2))return b}s=stem1(s)}return null}
function capacity(){const F=(1+20+400+8000+160000+3200000)*(3*19*27+2*16*8);let tot=0;ROOTS.forEach(r=>{const n=r.length;tot+=n>=6?1+n+n*28+(n+1)*29:1});return tot*F*8}
function canon(s){let x=s;SYN.forEach(([re,r])=>{x=x.replace(re,r)});
 x=x.split(" ").map(w=>{if(w.length<5||VOC.includes(w))return w;const rr=rootOf(w);if(rr)return rr;let best=w,bd=9;for(const v of VOC){const d=lev(w,v);if(d<bd){bd=d;best=v}}return bd<=(w.length<8?1:2)?best:w}).join(" ");

}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(){
  if(window.__listening){try{window.__rec.stop()}catch(e){}log("Dinleme KAPALI","inf");return}
  if(busy)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){log("Bu cihazda Web Speech API yok. Komut kutusunu kullan.","err");return}
  const r=new SR();r.lang="tr-TR";r.interimResults=false;r.maxAlternatives=3;
  $("listen").classList.add("on");status("DİNLİYOR...");
  window.__rec=r;window.__listening=true;log("Dinleme AÇIK (kapatmak için başlığa tekrar 5 sn bas)","inf");
  r.onresult=e=>{handle(e.results[0][0].transcript)};
  r.onerror=e=>{log("Mikrofon hatası: "+e.error,"err")};
  r.onend=()=>{window.__listening=false;$("listen").classList.remove("on");if(!busy)status("HAZIR · 5 sn basılı tut")};
  try{r.start()}catch(e){$("listen").classList.remove("on")}
}
