<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Karanlık Bataklık</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <video id="cam" playsinline muted></video>

  <!-- Dokunma katmanı: sol yarı = hareket joystick'i (sınırsız mesafe), sağ yarı = sadece bakış (kısa dokunuş = ateş) -->
  <div id="touch"></div>
  <div id="joy"><div id="knob"></div></div>

  <div id="hud">
    <span>🪰 <b id="flies">0</b>/<b id="need">6</b></span>
    <span>⏱ <b id="time">0</b> sn</span>
    <span>🔫 <b id="gun">-</b> · <b id="shells">0</b> mermi</span>
    <span>👁 <b id="eyes">açık</b></span>
    <span id="dry" title="Göz kuruluğu"><i id="dryFill"></i></span>
  </div>
  <div id="msg"></div>
  <button id="eyeBtn" class="hidden">GÖZÜ<br>KAPAT</button>
  <button id="swapBtn" class="hidden">SİLAH<br>DEĞİŞ</button>
  <button id="fireBtn" class="hidden">ATEŞ</button>

  <div id="menu">
    <div class="box">
      <h1>🐸 Karanlık Bataklık</h1>
      <p class="story">Bataklığın labirentinde mahsur kaldın. Etraf zifiri karanlık, mezarlar ve gölgeler seni bekliyor.</p>
      <ul class="rules" id="rules"></ul>
      <p id="result" class="result"></p>
      <div class="controls">
        <button id="start">Kamerayı aç ve başla</button>
        <button id="keyboard" class="ghost">Kamerasız dene (dokunmatik / klavye)</button>
      </div>
      <p id="status" class="status">Yükleniyor…</p>
      <p class="hint">Klavye: <kbd>W A S D</kbd> yürü, <kbd>Q</kbd>/<kbd>E</kbd> ya da ok tuşları bak, <kbd>F</kbd> ateş, <kbd>R</kbd> silah değiş, <kbd>Boşluk</kbd> basılı = gözünü kapat.</p>
    </div>
  </div>
  <pre id="debuglog" hidden></pre>
  <script type="module" src="js/main.js"></script>
</body>
</html>
