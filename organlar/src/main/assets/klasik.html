<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e6eef3">
<title>İnsan Vücudu Atlası</title>
<style>
:root{--ink:#1d4a73;--paper:#e6eef3;--grid:#c6d6e1;--red:#d93a45;--mark:#f6c026;--fg:#14283a;--muted:#4a6275;
 --serif:"Noto Serif","Droid Serif",Rockwell,"Roboto Slab",Georgia,serif;
 --sans:"Noto Sans",Roboto,"Segoe UI","Trebuchet MS",system-ui,sans-serif;
 --bg:var(--paper);--panel:#fff;--card:#eef4f8;--line:#1d4a7340;--text:var(--fg);--accent:var(--ink);--accent2:var(--red)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--fg);font:16px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--mark)}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:
 linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/48px 48px,
 linear-gradient(var(--grid) 1px,transparent 1px) 0 0/48px 48px,var(--paper)}
#stage::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;pointer-events:none;opacity:.55;background:repeating-linear-gradient(to bottom,var(--ink) 0 1px,transparent 1px 12px)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#top{position:absolute;left:0;right:0;top:0;display:flex;gap:12px;align-items:center;padding:12px 14px 12px 22px;pointer-events:none}
#top h1{margin:0;font-family:var(--serif);font-size:1.35rem;font-weight:800;letter-spacing:-.4px;line-height:1.1;color:var(--ink);white-space:nowrap}
#q{pointer-events:auto;flex:1;min-width:0;max-width:340px;margin-left:auto;height:52px;background:#fff;color:var(--fg);border:2px solid var(--ink);border-radius:12px;padding:0 14px;font-size:16px;outline:none;box-shadow:0 3px 0 #1d4a7333}
#q::placeholder{color:var(--muted);opacity:.85}
#q:focus{box-shadow:0 0 0 4px var(--mark)}
#lab{position:absolute;left:0;top:0;pointer-events:none;display:none;transform:translate(-50%,-135%);background:var(--fg);border-left:6px solid var(--mark);color:#fff;padding:6px 12px;border-radius:8px;font-size:.95rem;font-weight:600;white-space:nowrap;box-shadow:0 5px 18px #18253620}
#lab:after{content:"";position:absolute;left:50%;top:100%;width:2px;height:14px;background:var(--fg)}
#hint{position:absolute;left:0;right:0;bottom:84px;text-align:center;color:var(--ink);font-size:.9rem;font-weight:600;pointer-events:none;transition:opacity .6s;padding:0 18px;text-shadow:0 0 6px var(--paper),0 0 2px var(--paper)}
#tools{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;padding:0 10px;flex-wrap:wrap}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:66px;min-height:56px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:4px 8px;font-size:.78rem;font-weight:700;box-shadow:0 3px 0 #1d4a7333;transition:background .18s,color .18s}
.tb b{font-size:1.25rem;line-height:1.15;font-weight:400}
.tb:hover{background:#eef5fa}
.tb:active{transform:translateY(2px);box-shadow:none}
.tb[aria-pressed="true"]{background:var(--ink);color:#fff}
#err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--red);font-weight:700;font-family:var(--serif)}
#sheet{flex:0 0 46%;min-height:0;display:flex;flex-direction:column;background:#fff;border-top:2px solid var(--ink);border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 0 #1d4a7322}
#sheet[hidden]{display:none}
.tabs{display:flex;gap:4px;padding:8px 10px 0;border-bottom:2px solid var(--paper);flex:0 0 auto}
.tabs button{background:none;border:0;border-bottom:4px solid transparent;color:var(--muted);font-weight:700;font-size:1rem;min-height:48px;padding:6px 12px;border-radius:8px 8px 0 0}
.tabs button:hover{background:var(--paper)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--red)}
.tabs #x{margin-left:auto;min-width:48px;font-size:1.2rem;color:var(--ink)}
.view{flex:1 1 auto;overflow-y:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view[hidden]{display:none}
.gh{display:flex;align-items:center;gap:10px;margin:16px 0 8px;font-family:var(--serif);font-size:1.05rem;font-weight:800;color:var(--ink)}
.gh:first-child{margin-top:2px}
.dot{width:16px;height:16px;border-radius:4px;flex:0 0 auto;box-shadow:0 0 0 2px #fff,0 0 0 3px #14283a40}
.items{display:flex;flex-wrap:wrap;gap:8px}
.it{background:#fff;color:var(--fg);border:2px solid var(--ink);border-radius:10px;min-height:44px;padding:6px 14px;font-size:.95rem;font-weight:600;max-width:100%;text-align:left;box-shadow:0 2px 0 #1d4a7333}
.it:hover{background:var(--paper)}
.it:active{transform:translateY(2px);box-shadow:none}
.it[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.none{color:var(--muted);padding:24px 4px;text-align:center;font-size:1rem}
.lay{display:grid;grid-template-columns:minmax(176px,50%) 1fr;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--grid)}
.lay label{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px}
.lay input[type=checkbox]{width:26px;height:26px;margin:0;accent-color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;padding:0;border:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--grid)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;border:4px solid var(--ink);background:#fff}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--grid)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--red)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;border:4px solid var(--ink);background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pill{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:10px;min-height:44px;padding:6px 14px;font-size:.92rem;font-weight:700;box-shadow:0 2px 0 #1d4a7333}
.pill:hover{background:var(--paper)}
.pill:active{transform:translateY(2px);box-shadow:none;background:var(--paper)}
.sl{display:block;margin:16px 0 2px;font-family:var(--serif);font-weight:800;color:var(--ink)}
#v-info h2{margin:2px 0 0;font-family:var(--serif);font-size:1.55rem;font-weight:800;letter-spacing:-.3px;line-height:1.2;color:var(--ink);overflow-wrap:anywhere}
.tag{display:inline-block;margin:6px 0 6px;padding:2px 10px;border-radius:6px;background:var(--red);color:#fff;font-size:.82rem;font-weight:700}
dl{margin:0}dt{font-family:var(--serif);font-weight:800;font-size:.95rem;color:var(--ink);margin-top:14px}dd{margin:3px 0 0;font-size:1rem;line-height:1.6}
.nums{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.num{flex:1 1 96px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:8px;text-align:center}.num b{display:block;color:var(--ink);font-size:1.15rem;font-weight:800}.num span{font-size:.82rem;color:var(--muted)}
.pl{list-style:none;margin:6px 0 0;padding:0}.pl li{padding:10px 12px;border-left:6px solid var(--ink);background:var(--card);border-radius:0 10px 10px 0;margin-bottom:8px;font-size:.95rem}.pl b{display:block;font-size:.98rem;color:var(--ink)}
.care{margin-top:16px;padding:12px 14px;border-radius:12px;background:#fff;border:2px dashed var(--red);font-size:.95rem;line-height:1.6}
@media(max-width:420px){#top{gap:8px;padding-left:20px}#top h1{font-size:1.12rem}#q{font-size:14px;padding:0 10px}}
@media(max-width:380px){.tb{min-width:60px;padding:4px 4px}}
@media(min-width:820px){
 #app{flex-direction:row}
 #sheet{flex:0 0 400px;border-top:0;border-left:2px solid var(--ink);border-radius:0;box-shadow:-4px 0 0 #1d4a7322}
 #hint{bottom:88px}
 #top h1{font-size:1.9rem}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head><body>
<div id="app">
 <div id="stage">
  <canvas id="c" tabindex="0" aria-label="3 boyutlu insan vücudu"></canvas>
  <div id="top"><h1>İnsan Vücudu Atlası</h1><input id="q" type="search" placeholder="Yapı ara: kalp, femur, mide…" autocomplete="off" aria-label="Yapı ara"></div>
  <div id="lab"></div>
  <div id="hint">Döndürmek için sürükle · yakınlaştırmak için iki parmakla aç/kapa · bir yapıya dokun</div>
  <div id="tools">
   <button class="tb" id="b-list"><b>☰</b>Yapılar</button>
   <button class="tb" id="b-layers"><b>◧</b>Katmanlar</button>
   <button class="tb" id="b-ex" aria-pressed="false"><b>✦</b>Patlat</button>
   <button class="tb" id="b-rot" aria-pressed="false"><b>⟳</b>Döndür</button>
   <button class="tb" id="b-reset"><b>⌂</b>Sıfırla</button>
  </div>
  <div id="err">3D kitaplığı (three.min.js) yüklenemedi. Uygulamayı güncelle ve tekrar dene.</div>
 </div>
 <aside id="sheet" hidden>
  <div class="tabs" role="tablist">
   <button role="tab" data-t="list">Yapılar</button>
   <button role="tab" data-t="layers">Katmanlar</button>
   <button role="tab" data-t="info">Bilgi</button>
   <button id="x" aria-label="Kapat">✕</button>
  </div>
  <div class="view" id="v-list"></div>
  <div class="view" id="v-layers" hidden></div>
  <div class="view" id="v-info" hidden></div>
 </aside>
</div>
<script src="three.min.js"></script>
<script src="data.js"></script>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id)}
if(!window.THREE){$("err").style.display="flex";return}
var T=THREE;

/* ---------- Ek bilgiler (organ dışı yapılar) ---------- */
var EXTRA={
skin:{fn:"Vücudu örter; mikroplardan, sudan ve güneşten korur, sıcaklığı dengeler, dokunmayı hissettirir.",where:"Vücudun tüm dış yüzeyi.",fact:"Vücudun en büyük organıdır; yetişkinde yaklaşık 2 m² yüzeyi vardır."},
skull:{fn:"Beyni, gözleri ve kulakları korur; yüze şeklini verir.",where:"Başta.",fact:"Kafatası 22 kemikten oluşur. Çene kemiği hariç hepsi eklemlerle kaynaşmış gibi sabittir."},
mandible:{fn:"Çiğnemeyi ve konuşmayı sağlar; dişleri taşır.",where:"Yüzün alt kısmı.",fact:"Kafatasında hareket edebilen tek kemiktir."},
cervical:{fn:"Başı taşır; başı çevirip eğmemizi sağlar.",where:"Boyunda, 7 omur.",fact:"Zürafanın da insanla aynı sayıda, yani 7 boyun omuru vardır."},
thoracic:{fn:"Kaburgalarla birleşerek göğüs kafesini oluşturur.",where:"Sırtın orta kısmında, 12 omur.",fact:"Her sırt omuruna bir çift kaburga bağlanır."},
lumbar:{fn:"Üst vücudun ağırlığını taşır ve öne arkaya eğilmemizi sağlar.",where:"Belde, 5 omur.",fact:"Omurganın en büyük ve en güçlü omurlarıdır."},
sacrum:{fn:"Omurgayı leğen kemiğine bağlar; vücut ağırlığını bacaklara aktarır.",where:"Omurganın en altında, leğen kemiklerinin arasında.",fact:"5 omurun kaynaşmasıyla oluşur. Altındaki küçük kemik kuyruk sokumu (koksiks) denir."},
ribs:{fn:"Kalbi ve akciğerleri korur; nefes alıp verirken açılıp kapanır.",where:"Göğüs kafesinde, her yanda 12 kaburga.",fact:"İlk 7 çift kaburga doğrudan göğüs kemiğine bağlanır. Son 2 çift öne bağlanmaz, ucu serbesttir."},
sternum:{fn:"Ön kaburgaları birbirine bağlar, kalbin önünü korur.",where:"Göğsün tam ortasında.",fact:"Yassı, kılıç biçiminde bir kemiktir."},
clavicle:{fn:"Omuzu gövdeye bağlar ve kolun serbestçe hareket etmesine yardım eder.",where:"Boyun ile omuz arasında.",fact:"Vücudun en sık kırılan kemiklerinden biridir."},
scapula:{fn:"Omuz eklemini oluşturur; kol kaslarının tutunduğu yerdir.",where:"Sırtın üst kısmında, kaburgaların arkasında.",fact:"Üçgen şeklinde yassı bir kemiktir."},
humerus:{fn:"Omuz ile dirsek arasını oluşturur; kolu kaldırmayı sağlar.",where:"Üst kolda.",fact:"Kolun en uzun kemiğidir."},
forearm:{fn:"Bileği çevirmeyi ve elin hareketini sağlar.",where:"Dirsek ile bilek arasında.",fact:"Ön kolda iki kemik vardır: dış yanda radius, iç yanda ulna."},
hand:{fn:"Tutmayı, yazmayı ve ince işleri yapmayı sağlar.",where:"Bilekten parmak uçlarına kadar.",fact:"Her elde 27 kemik vardır; iki el vücuttaki kemiklerin yaklaşık dörtte birini taşır."},
pelvis:{fn:"Alt karın organlarını taşır ve korur; bacakları gövdeye bağlar.",where:"Belin altında.",fact:"Kalça kemikleri kemik iliği ve kan hücresi üretimi için de önemlidir."},
femur:{fn:"Yürüme, koşma ve zıplama sırasında vücudu taşır.",where:"Uylukta.",fact:"Vücudun en uzun ve en güçlü kemiğidir."},
patella:{fn:"Diz eklemini korur ve bacak kaslarının gücünü artırır.",where:"Dizin önünde.",fact:"Yuvarlak, küçük bir kemiktir; diz kapağı da denir."},
shin:{fn:"Ağırlığı ayağa taşır; yürürken dengeyi sağlar.",where:"Dizden ayak bileğine kadar.",fact:"Alt bacakta iki kemik vardır: kalın olan kaval kemiği (tibia), ince olan baldır kemiği (fibula)."},
foot:{fn:"Vücudu dengede tutar, yürürken yere basmayı ve itmeyi sağlar.",where:"Ayak bileğinden parmaklara kadar.",fact:"Her ayakta 26 kemik vardır."},
trapezius:{fn:"Omuzları yukarı çeker, boynu ve sırtı taşır.",where:"Boyundan sırtın ortasına kadar.",fact:"Trapez (yamuk) şeklinde olduğu için bu adı alır."},
lats:{fn:"Kolu aşağı ve geriye çeker; yüzmede ve tırmanmada çok kullanılır.",where:"Sırtın alt yanlarında.",fact:"Sırtın en geniş kasıdır."},
pectoral:{fn:"Kolu öne ve içe doğru çeker; itme hareketlerinde çalışır.",where:"Göğsün ön yüzünde.",fact:"Şınav çekerken en çok bu kaslar çalışır."},
deltoid:{fn:"Kolu yana ve yukarı kaldırır.",where:"Omuzun üstünde.",fact:"Yunan harfi delta (Δ) gibi üçgen görünür."},
biceps:{fn:"Dirseği bükmeyi sağlar.",where:"Üst kolun ön yüzünde.",fact:"Adı ‘iki başlı’ demektir; iki ayrı yerden kemiğe tutunur."},
fmuscle:{fn:"Bileği ve parmakları hareket ettirir.",where:"Ön kolda.",fact:"Bir şeyi sıkıca kavradığımızda bu kaslar çalışır."},
abs:{fn:"Gövdeyi öne eğer, karın organlarını korur, duruşu destekler.",where:"Karnın ön yüzünde.",fact:"Kaslar çekerek çalışır, itemez; bu yüzden birbirine zıt çalışan çiftler hâlinde bulunurlar."},
obliques:{fn:"Gövdeyi yana eğer ve çevirir.",where:"Karnın yan yüzlerinde.",fact:"Öksürürken ve hapşırırken de çalışırlar."},
glute:{fn:"Bacağı arkaya iter; ayakta durmayı ve yürümeyi sağlar.",where:"Kalçada.",fact:"Vücudun en büyük kaslarından biridir."},
quad:{fn:"Dizi düzeltir; yürümek, koşmak ve zıplamak için gerekir.",where:"Uylukta, ön yüzde.",fact:"Adı ‘dört başlı’ demektir; dört ayrı kastan oluşur."},
calf:{fn:"Ayak parmaklarının ucuna yükselmeyi ve itmeyi sağlar.",where:"Alt bacağın arkasında.",fact:"Aşil tendonu ile topuk kemiğine bağlanır; bu vücudun en kalın tendonudur."},
aorta:{fn:"Kalpten çıkan temiz kanı vücudun her yerine taşıyan atardamarlardır.",where:"Kalpten çıkıp omurganın önünden aşağı iner, kollara ve bacaklara dallanır.",fact:"Aort, en büyük atardamardır; kalınlığı bahçe hortumu kadardır."},
veins:{fn:"Oksijeni azalmış kanı kalbe geri getiren toplardamarlardır.",where:"Kol ve bacaklardan kalbe doğru uzanırlar.",fact:"Bacaklardaki toplardamarlarda, kanın geri akmasını önleyen küçük kapakçıklar vardır."},
spinal:{fn:"Beyin ile vücut arasında haber taşır; refleksleri yönetir.",where:"Omurganın içindeki kanalda, omurlarla korunur.",fact:"Yaklaşık 45 cm uzunluğundadır ve parmak kalınlığındadır."},
narm:{fn:"Beyinden gelen hareket emirlerini kola, koldan gelen dokunma ve acı bilgisini beyne taşır.",where:"Omurilikten omuza, oradan ele uzanır.",fact:"Dirseğin iç tarafındaki ‘kıskıs’ sinirine çarpınca elektrik çarpmış gibi olursun."},
nleg:{fn:"Bacak kaslarına hareket emri götürür, bacaktan duyu bilgisi taşır.",where:"Omurilikten kalçaya, oradan ayağa uzanır.",fact:"Bacağın arkasından inen siyatik sinir vücudun en uzun ve en kalın sinirleridir."},
trachea:{fn:"Soluduğumuz havayı akciğerlere taşır.",where:"Boğazda, yemek borusunun önünde; göğüste iki bronşa ayrılır.",fact:"Kıkırdak halkalarla desteklenir, bu yüzden hava yolu hep açık kalır. Uzunluğu yaklaşık 11 cm’dir."},
diaphragm:{fn:"Nefes almamızı sağlayan ana kastır; kasılınca hava akciğerlere dolar.",where:"Göğüs boşluğu ile karın boşluğunun arasında.",fact:"Hıçkırık, diyaframın birdenbire kasılmasıdır."},
esoph:{fn:"Çiğnenen lokmayı kas hareketleriyle mideye taşır.",where:"Boğaz ile mide arasında, soluk borusunun arkasında.",fact:"Yaklaşık 25 cm’dir. Baş aşağı dursan bile yutulan lokma, kasların sıkıştırmasıyla mideye ulaşır."},
ureter:{fn:"Böbreklerde oluşan idrarı mesaneye taşır.",where:"Her böbrekten mesaneye inen ince kanal.",fact:"Her biri yaklaşık 25–30 cm uzunluğundadır."}
};

/* ---------- Sahne ---------- */
var canvas=$("c"),stage=$("stage");
var renderer;
try{renderer=new T.WebGLRenderer({canvas:canvas,antialias:true,alpha:true})}
catch(e){$("err").textContent="Bu cihazda 3D (WebGL) açılamadı.";$("err").style.display="flex";return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0xe6eef3,0);
var scene=new T.Scene();
var camera=new T.PerspectiveCamera(40,1,0.1,200);
scene.add(new T.HemisphereLight(0xffffff,0x3a4256,0.95));
var dl=new T.DirectionalLight(0xffffff,0.75);dl.position.set(6,12,14);scene.add(dl);
var dl2=new T.DirectionalLight(0x9fc4ff,0.35);dl2.position.set(-8,5,-10);scene.add(dl2);
var floor=new T.Mesh(new T.CircleGeometry(4.2,48),new T.MeshBasicMaterial({color:0xf4f8fa,transparent:true,opacity:.75}));
floor.rotation.x=-Math.PI/2;floor.position.y=-0.02;scene.add(floor);

/* ---------- Sistemler ---------- */
var SYS={
 skin:{n:"Deri",c:"#e0a98a",on:true,op:.14},
 skeleton:{n:"İskelet",c:"#e8dfc6",on:true,op:.45},
 muscle:{n:"Kas sistemi",c:"#c0504d",on:false,op:.9},
 circ:{n:"Dolaşım sistemi",c:"#e0334a",on:true,op:1},
 nerve:{n:"Sinir sistemi",c:"#f2d04a",on:true,op:1},
 resp:{n:"Solunum sistemi",c:"#f0a0a0",on:true,op:1},
 digest:{n:"Sindirim sistemi",c:"#e8a06a",on:true,op:1},
 urin:{n:"Boşaltım sistemi",c:"#d08a50",on:true,op:1},
 immune:{n:"Lenf ve bağışıklık",c:"#9a5f9e",on:true,op:1}
};
var SORDER=["skin","skeleton","muscle","circ","nerve","resp","digest","urin","immune"];
SORDER.forEach(function(k){SYS[k].id=k;SYS[k].def={on:SYS[k].on,op:SYS[k].op}});

/* ---------- Yardımcılar ---------- */
var PARTS=[],BYKEY={};
function V(x,y,z){return new T.Vector3(x,y,z)}
function M(c,o){o=o||{};return new T.MeshStandardMaterial({color:c,roughness:o.r==null?.55:o.r,metalness:0,transparent:true,opacity:1,side:o.dbl?T.DoubleSide:T.FrontSide})}

var S={sel:null,hover:null,isolate:false,ex:0,exT:0,auto:false,tab:"list"};
function info(p){return INFO[p.info]||EXTRA[p.info]||{}}

function applyTargets(){
 var onlySkin=SORDER.every(function(k){return k==="skin"||!SYS[k].on});
 PARTS.forEach(function(p){
  var sy=SYS[p.sys],vis=sy.on,op=sy.op;
  if(S.sel){
   if(p===S.sel){vis=true;op=1}
   else if(S.isolate)vis=false;
   else op=Math.min(op,.1)
  }
  p.tgt=vis?op:0;
  p.canPick=p.pick&&vis&&(p.sys!=="skin"||onlySkin||p===S.sel);
  var h=p===S.sel?0x1b6a96:p===S.hover?0x14455f:0;
  p.mats.forEach(function(m){m.emissive.setHex(h)});
 })
}

/* ---------- Kamera ---------- */
var cam={yaw:0,pitch:.06,dist:26,tx:0,ty:9.2,tz:0},goal=null;
function fitDist(){
 var w=stage.clientWidth||1,h=stage.clientHeight||1,a=w/h,t=Math.tan(camera.fov*Math.PI/360);
 return Math.max(10.4/t,5.6/(t*a))}
function placeCam(){
 var cp=Math.cos(cam.pitch);
 camera.position.set(cam.tx+cam.dist*Math.sin(cam.yaw)*cp,cam.ty+cam.dist*Math.sin(cam.pitch),cam.tz+cam.dist*Math.cos(cam.yaw)*cp);
 camera.lookAt(cam.tx,cam.ty,cam.tz)}
function resize(){
 var w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function resetView(){
 goal={tx:0,ty:9.2,tz:0,dist:fitDist(),yaw:Math.round(cam.yaw/(Math.PI*2))*Math.PI*2,pitch:.06}}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
window.addEventListener("resize",resize);

/* ---------- Giriş (döndür / yakınlaştır / kaydır / dokun) ---------- */
var ptrs={},tapInfo=null,lastPinch=0,lastMid=null,rc=new T.Raycaster(),mouse=new T.Vector2();
function cancelGoal(){goal=null}
function hideHint(){$("hint").style.opacity=0}
function pickAt(cx,cy){
 var r=canvas.getBoundingClientRect();
 mouse.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height*2-1));
 rc.setFromCamera(mouse,camera);
 var list=[];PARTS.forEach(function(p){if(p.canPick&&p.cur>.12)for(var i=0;i<p.meshes.length;i++)list.push(p.meshes[i])});
 var hits=rc.intersectObjects(list,false);
 return hits.length?hits[0].object.userData.part:null}
canvas.addEventListener("pointerdown",function(e){
 try{canvas.setPointerCapture(e.pointerId)}catch(_){}
 ptrs[e.pointerId]={x:e.clientX,y:e.clientY,b:e.button};
 var n=Object.keys(ptrs).length;
 tapInfo=n===1?{x:e.clientX,y:e.clientY,t:Date.now()}:null;
 if(n===2){var k=Object.keys(ptrs),a=ptrs[k[0]],b=ptrs[k[1]];lastPinch=Math.hypot(a.x-b.x,a.y-b.y);lastMid={x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
 cancelGoal();hideHint()});
canvas.addEventListener("pointermove",function(e){
 var p=ptrs[e.pointerId];
 if(!p){
  if(e.pointerType==="mouse"){var h=pickAt(e.clientX,e.clientY);if(h!==S.hover){S.hover=h;applyTargets();canvas.style.cursor=h?"pointer":"default"}}
  return}
 var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 var keys=Object.keys(ptrs),n=keys.length;
 if(tapInfo&&Math.hypot(e.clientX-tapInfo.x,e.clientY-tapInfo.y)>8)tapInfo=null;
 if(n===1){
  if(p.b===2||e.shiftKey)pan(dx,dy);
  else{cam.yaw-=dx*.008;cam.pitch=Math.max(-1.35,Math.min(1.35,cam.pitch+dy*.008))}
 }else if(n===2){
  var a=ptrs[keys[0]],b=ptrs[keys[1]],d=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  if(lastPinch>0)cam.dist=Math.max(3,Math.min(60,cam.dist*lastPinch/Math.max(d,1)));
  if(lastMid)pan(mid.x-lastMid.x,mid.y-lastMid.y);
  lastPinch=d;lastMid=mid}
});
function pan(dx,dy){
 var k=cam.dist*2*Math.tan(camera.fov*Math.PI/360)/Math.max(stage.clientHeight,1);
 cam.tx+=-dx*k*Math.cos(cam.yaw);cam.tz+=dx*k*Math.sin(cam.yaw);cam.ty+=dy*k;
 cam.tx=Math.max(-8,Math.min(8,cam.tx));cam.tz=Math.max(-8,Math.min(8,cam.tz));cam.ty=Math.max(0,Math.min(19,cam.ty))}
function endPtr(e){
 var was=ptrs[e.pointerId];delete ptrs[e.pointerId];
 var n=Object.keys(ptrs).length;if(n<2){lastPinch=0;lastMid=null}
 if(was&&tapInfo&&n===0&&e.type==="pointerup"&&Date.now()-tapInfo.t<600){
  var h=pickAt(e.clientX,e.clientY);
  if(h)selectPart(h,true,true);else if(S.sel)clearSel();
 }
 if(n===0)tapInfo=null}
canvas.addEventListener("pointerup",endPtr);
canvas.addEventListener("pointercancel",endPtr);
canvas.addEventListener("contextmenu",function(e){e.preventDefault()});
canvas.addEventListener("wheel",function(e){e.preventDefault();cancelGoal();hideHint();cam.dist=Math.max(3,Math.min(60,cam.dist*Math.exp(e.deltaY*.0012)))},{passive:false});

/* ---------- Seçim ---------- */
function selectPart(p,focus,openInfo){
 S.sel=p;S.isolate=false;
 if(!SYS[p.sys].on){SYS[p.sys].on=true;renderLayers()}
 applyTargets();renderList();renderInfo();
 if(openInfo)showSheet("info");
 if(focus){
  var c=p.pv.position.clone();
  goal={tx:c.x,ty:c.y,tz:c.z,dist:Math.max(5,Math.min(fitDist(),p.size*2.6+3.5))}}
}
function clearSel(){S.sel=null;S.isolate=false;applyTargets();renderList();renderInfo()}

/* ---------- Panel ---------- */
var sheet=$("sheet");
function showSheet(tab){
 sheet.hidden=false;S.tab=tab;
 ["list","layers","info"].forEach(function(t){
  $("v-"+t).hidden=t!==tab;
  var b=sheet.querySelector('.tabs [data-t="'+t+'"]');b.setAttribute("aria-selected",t===tab?"true":"false")});
 setTimeout(resize,30)}
function hideSheet(){sheet.hidden=true;setTimeout(resize,30)}
sheet.querySelector(".tabs").addEventListener("click",function(e){
 var t=e.target.getAttribute&&e.target.getAttribute("data-t");if(t)showSheet(t)});
$("x").onclick=hideSheet;
$("b-list").onclick=function(){if(!sheet.hidden&&S.tab==="list")hideSheet();else showSheet("list")};
$("b-layers").onclick=function(){if(!sheet.hidden&&S.tab==="layers")hideSheet();else showSheet("layers")};
$("b-ex").onclick=function(){S.exT=S.exT>.5?0:1;syncEx()};
$("b-rot").onclick=function(){S.auto=!S.auto;$("b-rot").setAttribute("aria-pressed",S.auto?"true":"false")};
$("b-reset").onclick=function(){
 SORDER.forEach(function(k){SYS[k].on=SYS[k].def.on;SYS[k].op=SYS[k].def.op});
 S.exT=0;S.sel=null;S.isolate=false;S.hover=null;$("q").value="";
 applyTargets();renderLayers();renderList();renderInfo();syncEx();resetView()};
function syncEx(){
 $("b-ex").setAttribute("aria-pressed",S.exT>.5?"true":"false");
 var r=document.getElementById("exr");if(r)r.value=S.exT}

function lc(s){return String(s).toLocaleLowerCase("tr")}
function renderList(){
 var q=lc($("q").value.trim()),h="",any=false;
 SORDER.forEach(function(k){
  var items=PARTS.filter(function(p){return p.sys===k&&(!q||lc(p.name).indexOf(q)>=0||lc(SYS[k].n).indexOf(q)>=0)});
  if(!items.length)return;any=true;
  h+='<div class="gh"><span class="dot" style="background:'+SYS[k].c+'"></span>'+SYS[k].n+'</div><div class="items">'+
   items.map(function(p){return '<button class="it" data-k="'+p.key+'" aria-pressed="'+(p===S.sel?"true":"false")+'">'+p.name+'</button>'}).join("")+'</div>'});
 $("v-list").innerHTML=any?h:'<div class="none">Bu aramayla eşleşen yapı yok.</div>'}
$("v-list").addEventListener("click",function(e){
 var k=e.target.getAttribute&&e.target.getAttribute("data-k");if(k&&BYKEY[k])selectPart(BYKEY[k],true,true)});
$("q").addEventListener("input",function(){renderList();showSheet("list")});
$("q").addEventListener("keydown",function(e){
 if(e.key==="Enter"){var q=lc($("q").value.trim());if(!q)return;
  var m=PARTS.filter(function(p){return lc(p.name).indexOf(q)>=0});
  if(m.length){selectPart(m[0],true,true);$("q").blur()}}});

function renderLayers(){
 var h='<div class="row"><button class="pill" data-p="all">Hepsi</button><button class="pill" data-p="organs">Sadece organlar</button><button class="pill" data-p="bones">Sadece iskelet</button><button class="pill" data-p="muscles">Sadece kaslar</button></div>';
 SORDER.forEach(function(k){var s=SYS[k];
  h+='<div class="lay"><label><input type="checkbox" data-s="'+k+'"'+(s.on?" checked":"")+'><span class="dot" style="background:'+s.c+'"></span>'+s.n+'</label>'+
   '<input type="range" min="0.05" max="1" step="0.05" value="'+s.op+'" data-o="'+k+'" aria-label="'+s.n+' görünürlüğü"></div>'});
 h+='<label class="sl" for="exr">Patlatılmış görünüm</label><input id="exr" type="range" min="0" max="1" step="0.02" value="'+S.exT+'" style="width:100%;accent-color:var(--accent)">';
 $("v-layers").innerHTML=h}
$("v-layers").addEventListener("input",function(e){
 var t=e.target;
 if(t.id==="exr"){S.exT=parseFloat(t.value);$("b-ex").setAttribute("aria-pressed",S.exT>.5?"true":"false");return}
 var o=t.getAttribute("data-o");if(o){SYS[o].op=parseFloat(t.value);applyTargets()}});
$("v-layers").addEventListener("change",function(e){
 var s=e.target.getAttribute("data-s");if(s){SYS[s].on=e.target.checked;applyTargets()}});
$("v-layers").addEventListener("click",function(e){
 var p=e.target.getAttribute&&e.target.getAttribute("data-p");if(!p)return;
 var sets={all:["skin","skeleton","muscle","circ","nerve","resp","digest","urin","immune"],
  organs:["circ","nerve","resp","digest","urin","immune"],bones:["skeleton"],muscles:["muscle"]};
 SORDER.forEach(function(k){SYS[k].on=sets[p].indexOf(k)>=0;SYS[k].op=p==="all"?SYS[k].def.op:1});
 if(p==="all")SYS.muscle.op=.5;
 applyTargets();renderLayers()});

function renderInfo(){
 var p=S.sel,v=$("v-info");
 if(!p){v.innerHTML='<div class="none">Bir yapıya dokun ya da “Yapılar” sekmesinden seç.</div>';return}
 var d=info(p),h='<h2>'+p.name+'</h2><span class="tag">'+SYS[p.sys].n+'</span>';
 h+='<div class="row"><button class="pill" data-a="focus">Odakla</button><button class="pill" data-a="iso">'+(S.isolate?"Diğerlerini göster":"Tek başına göster")+'</button><button class="pill" data-a="clear">Seçimi kaldır</button></div>';
 if(d.num)h+='<div class="nums">'+d.num.map(function(a){return '<div class="num"><b>'+a[0]+'</b><span>'+a[1]+'</span></div>'}).join("")+'</div>';
 h+='<dl>';
 if(d.fn)h+='<dt>Görevi</dt><dd>'+d.fn+'</dd>';
 if(d.where)h+='<dt>Konumu</dt><dd>'+d.where+'</dd>';
 if(d.size)h+='<dt>Boyut / ağırlık</dt><dd>'+d.size+'</dd>';
 if(d.pl)h+='<dt>Bölümleri</dt><dd><ul class="pl">'+d.pl.map(function(a){return '<li><b>'+a[0]+'</b>'+a[1]+'</li>'}).join("")+'</ul></dd>';
 if(d.fact)h+='<dt>İlginç bilgi</dt><dd>'+d.fact+'</dd>';
 h+='</dl>';
 if(d.care)h+='<div class="care">🌿 <b>Sağlıklı kalması için:</b> '+d.care+'</div>';
 v.innerHTML=h}
$("v-info").addEventListener("click",function(e){
 var a=e.target.getAttribute&&e.target.getAttribute("data-a");if(!a||!S.sel)return;
 if(a==="focus"){var c=S.sel.pv.position;goal={tx:c.x,ty:c.y,tz:c.z,dist:Math.max(5,Math.min(fitDist(),S.sel.size*2.6+3.5))}}
 if(a==="iso"){S.isolate=!S.isolate;applyTargets();renderInfo()}
 if(a==="clear")clearSel()});

/* ---------- Döngü ---------- */
var lab=$("lab"),clock=new T.Clock(),tmp=new T.Vector3();
function frame(){
 requestAnimationFrame(frame);
 var dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 if(goal){
  var k=1-Math.pow(.0015,dt);
  if(goal.tx!=null){cam.tx+=(goal.tx-cam.tx)*k;cam.ty+=(goal.ty-cam.ty)*k;cam.tz+=(goal.tz-cam.tz)*k}
  if(goal.dist!=null)cam.dist+=(goal.dist-cam.dist)*k;
  if(goal.yaw!=null)cam.yaw+=(goal.yaw-cam.yaw)*k;
  if(goal.pitch!=null)cam.pitch+=(goal.pitch-cam.pitch)*k;
  if(Math.abs(cam.dist-(goal.dist==null?cam.dist:goal.dist))<.02&&Math.abs(cam.tx-(goal.tx==null?cam.tx:goal.tx))<.02&&Math.abs(cam.ty-(goal.ty==null?cam.ty:goal.ty))<.02)goal=null}
 if(S.auto&&!Object.keys(ptrs).length&&!goal)cam.yaw+=dt*.45;
 S.ex+=(S.exT-S.ex)*(1-Math.pow(.002,dt));
 PARTS.forEach(function(p){
  var d=p.tgt-p.cur;
  if(Math.abs(d)>.004){p.cur+=d*Math.min(1,dt*9);var o=p.cur,vis=o>.02;
   p.meshes.forEach(function(m){m.visible=vis});
   if(vis)p.mats.forEach(function(m){m.opacity=o;m.depthWrite=o>.9})}
  else if(p.cur!==p.tgt){p.cur=p.tgt;var vv=p.cur>.02;p.meshes.forEach(function(m){m.visible=vv});p.mats.forEach(function(m){m.opacity=p.cur;m.depthWrite=p.cur>.9})}
  var e=S.ex*3.4;
  p.pv.position.set(p.base.x+p.dir.x*e,p.base.y+p.dir.y*e,p.base.z+p.dir.z*e);
  var sc=1;
  if(p.key==="heart")sc=1+.06*Math.pow(Math.max(0,Math.sin(t*7.5)),4);
  else if(p.key==="lungsR"||p.key==="lungsL")sc=1+.025*Math.sin(t*1.5);
  p.pv.scale.set(sc,sc,sc)});
 placeCam();
 if(S.sel&&S.sel.cur>.1){
  tmp.copy(S.sel.pv.position).project(camera);
  if(tmp.z<1){lab.style.display="block";lab.textContent=S.sel.name;
   lab.style.left=((tmp.x+1)/2*stage.clientWidth)+"px";lab.style.top=((1-tmp.y)/2*stage.clientHeight)+"px"}
  else lab.style.display="none"
 }else lab.style.display="none";
 renderer.render(scene,camera)}

/* ---------- Başlat ---------- */
applyTargets();
PARTS.forEach(function(p){p.cur=p.tgt;p.meshes.forEach(function(m){m.visible=p.cur>.02});p.mats.forEach(function(m){m.opacity=p.cur;m.depthWrite=p.cur>.9})});
renderLayers();renderList();renderInfo();resize();cam.dist=fitDist();placeCam();
setTimeout(function(){$("hint").style.opacity=0},9000);
frame();
})();
</script>
</body></html>
