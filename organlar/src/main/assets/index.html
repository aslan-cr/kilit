*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 12px;font-size:.95rem}
.wrap{display:grid;gap:14px}
@media(min-width:720px){.wrap{grid-template-columns:260px 1fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
#body{width:100%;max-width:300px;display:block;margin:0 auto;height:auto}
.organ{cursor:pointer;outline:none;transition:filter .15s}
.organ:hover,.organ:focus-visible{filter:brightness(1.15)}
.organ.sel use{stroke:var(--accent)!important;stroke-width:3!important;filter:drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 7px var(--accent))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
#detail h2{margin:0;font-size:1.3rem}
.tag{display:inline-block;margin:4px 0 8px;padding:2px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);font-size:.8rem}
#zoom{width:100%;max-width:260px;display:block;margin:6px auto 10px;background:radial-gradient(circle,var(--bg),transparent 70%);border-radius:50%}
.beat{animation:beat 1s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.breathe{animation:beat 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.07)}30%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.beat,.breathe{animation:none}}
dl{margin:0}dt{font-weight:600;font-size:.85rem;color:var(--accent);margin-top:10px}dd{margin:2px 0 0}
.lbl{fill:#fff;font-size:6.5px;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:1.2px;font-weight:600}
.hint{text-align:center;color:var(--muted);padding:24px 8px}
.nums{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.num{flex:1 1 90px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}.num b{display:block;color:var(--accent);font-size:1.05rem}.num span{font-size:.75rem;color:var(--muted)}
.pl{list-style:none;margin:6px 0 0;padding:0}.pl li{padding:8px 10px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 10px 10px 0;margin-bottom:6px;font-size:.92rem}.pl b{display:block;font-size:.9rem}
.care{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px dashed var(--accent);font-size:.92rem}
#skin{transition:opacity .7s}
#skel{opacity:0;transition:opacity .7s;pointer-events:none}
#organs .organ{opacity:0;transform:scale(.5);transform-box:fill-box;transform-origin:center;pointer-events:none;transition:opacity .6s,transform .6s,filter .15s}
#body.m-in #skin{opacity:.28}#body.m-sk #skin{opacity:.1}
#body.m-in #skel{opacity:.9}#body.m-sk #skel{opacity:1}
#body.m-in #organs .organ{opacity:1;transform:scale(1);pointer-events:auto}
@media(prefers-reduced-motion:reduce){#organs .organ,#skin,#skel{transition:none!important}}
