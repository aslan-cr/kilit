name: APK derle

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android lisanslarini kabul et
        run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: APK derle
        run: gradle assembleDebug
      - name: APK dosyalarini topla
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/kilit.apk
          cp updater/build/outputs/apk/debug/updater-debug.apk out/guncelle.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kilit-apk
          path: out
      - name: Release yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/kilit.apk out/guncelle.apk \
            --title "Build ${{ github.run_number }}" --notes "Otomatik derleme"
