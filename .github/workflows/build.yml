name: APK derle

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android lisanslarini kabul et
        run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Kitapliklari indir (libs.txt olan uygulamalar icin)
        run: |
          for f in */libs.txt; do
            [ -f "$f" ] || continue
            dir=$(dirname "$f")
            mkdir -p "$dir/src/main/assets"
            while read -r url name; do
              [ -z "$url" ] && continue
              curl -fsSL --retry 3 "$url" -o "$dir/src/main/assets/$name"
              test -s "$dir/src/main/assets/$name"
            done < "$f"
          done
      - name: Kitaplıkları indir (libs.txt olan uygulamalar için)
        run: |
          for f in */libs.txt; do
            [ -f "$f" ] || continue
            dir=$(dirname "$f")
            mkdir -p "$dir/src/main/assets"
            while read -r url name; do
              [ -z "$url" ] && continue
              curl -fsSL --retry 3 "$url" -o "$dir/src/main/assets/$name"
              test -s "$dir/src/main/assets/$name"
            done < "$f"
          done
      - name: Kamera modelini uygulamaya göm (gozkirpma, internetsiz çalışsın)
        run: sh gozkirpma/tools/fetch-mediapipe.sh || echo "UYARI: kamera modeli indirilemedi, uygulama internetten yüklemeyi deneyecek"
      - name: APK derle
        run: gradle assembleDebug
      - name: APK dosyalarini topla
        run: |
          mkdir out
          for f in $(find . -path "*/build/outputs/apk/debug/*-debug.apk"); do
            mod=${f#./}
            mod=${mod%%/*}
            case "$mod" in
              app) name=kilit ;;
              updater) name=guncelle ;;
              *) name="$mod" ;;
            esac
            cp "$f" "out/$name.apk"
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: kilit-apk
          path: out
      - name: Release yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --title "Build ${{ github.run_number }}" --notes "Otomatik derleme"
